name: Build Panel Maestro Windows Installer

on:
  push:
    branches: [main]
    paths:
      - 'installer/master/**'
      - '.github/workflows/build-master-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        shell: pwsh
        run: |
          choco install imagemagick -y --no-progress
          choco install innosetup -y --no-progress

      - name: Build icon and web assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets, dist, downloads | Out-Null
          $magick = (Get-Command magick.exe -ErrorAction SilentlyContinue).Source
          if (-not $magick) { throw "ImageMagick no disponible" }
          & $magick "installer/master/logo-original.svg" -filter Lanczos -resize 192x192 "assets/m-commerce-brand-original-192.png"
          & $magick "installer/master/logo-original.svg" -filter Lanczos -resize 512x512 "assets/m-commerce-brand-original-512.png"
          & $magick "installer/master/logo-original.svg" -define icon:auto-resize=256,128,64,48,32,24,16 "installer/master/mcommerce-original.ico"

      - name: Compile real Windows installer
        shell: pwsh
        run: |
          $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $iscc = Join-Path $pf86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler no disponible" }
          & $iscc "installer/master/M-Commerce-Panel-Maestro.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló con código $LASTEXITCODE" }
          Copy-Item "dist/M-Commerce-Panel-Maestro-Setup.exe" "downloads/M-Commerce-Panel-Maestro-Setup.exe" -Force

      - name: Validate installer output
        shell: pwsh
        run: |
          $f = Get-Item "downloads/M-Commerce-Panel-Maestro-Setup.exe"
          if ($f.Length -lt 300000) { throw "El instalador generado parece inválido: $($f.Length) bytes" }
          Write-Host "Installer bytes: $($f.Length)"

      - name: Publish generated installer and exact brand assets
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/M-Commerce-Panel-Maestro-Setup.exe assets/m-commerce-brand-original-192.png assets/m-commerce-brand-original-512.png
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "build(master): publish real Windows installer"
          git push

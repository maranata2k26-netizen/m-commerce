name: Build Panel Maestro Windows Installer

on:
  push:
    branches: [main]
    paths:
      - 'installer/master/**'
      - '.github/workflows/build-master-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          python -m pip install pillow --quiet

      - name: Build exact original icon and web assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path assets, dist, downloads | Out-Null
          @'
          import base64, io
          from PIL import Image
          p = r"installer/master/logo-original.png.b64"
          s = ''.join(open(p, encoding='utf-8').read().split())
          def valid_png(raw):
              try:
                  if raw[:8] != b'\\x89PNG\\r\\n\\x1a\\n':
                      return False
                  im = Image.open(io.BytesIO(raw))
                  return im.size == (64, 64) and im.format == 'PNG'
              except Exception:
                  return False
          raw = None
          try:
              candidate = base64.b64decode(s, validate=True)
              if valid_png(candidate):
                  raw = candidate
          except Exception:
              pass
          if raw is None:
              for i in range(len(s)):
                  t = s[:i] + s[i+1:]
                  if len(t) % 4:
                      continue
                  try:
                      candidate = base64.b64decode(t, validate=True)
                  except Exception:
                      continue
                  if valid_png(candidate):
                      raw = candidate
                      print(f"Recovered exact PNG by removing one accidental base64 character at index {i}")
                      break
          if raw is None:
              raise SystemExit("Could not recover original M Commerce PNG")
          open(r"installer/master/logo-original.png","wb").write(raw)
          im = Image.open(io.BytesIO(raw)).convert("RGBA")
          im.resize((192,192), Image.Resampling.LANCZOS).save(r"assets/m-commerce-brand-original-192.png")
          im.resize((512,512), Image.Resampling.LANCZOS).save(r"assets/m-commerce-brand-original-512.png")
          im.save(r"installer/master/mcommerce-original.ico", format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64)])
          '@ | Set-Content build_exact_brand.py
          python build_exact_brand.py

      - name: Compile real Windows installer
        shell: pwsh
        run: |
          $pf86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $iscc = Join-Path $pf86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe' }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler no disponible" }
          & $iscc "installer/master/M-Commerce-Panel-Maestro.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC falló con código $LASTEXITCODE" }
          Copy-Item "dist/M-Commerce-Panel-Maestro-Setup.exe" "downloads/M-Commerce-Panel-Maestro-Setup.exe" -Force

      - name: Validate installer output
        shell: pwsh
        run: |
          $f = Get-Item "downloads/M-Commerce-Panel-Maestro-Setup.exe"
          if ($f.Length -lt 300000) { throw "El instalador generado parece inválido: $($f.Length) bytes" }
          Write-Host "Installer bytes: $($f.Length)"

      - name: Smoke-test installer on Windows
        shell: pwsh
        run: |
          $installer = (Resolve-Path "downloads/M-Commerce-Panel-Maestro-Setup.exe").Path
          $testDir = Join-Path $env:TEMP "MCommercePanelMaestroTest"
          if (Test-Path $testDir) { Remove-Item $testDir -Recurse -Force }
          $desktop = [Environment]::GetFolderPath('Desktop')
          $shortcut = Join-Path $desktop 'M Commerce - Panel Maestro.lnk'
          if (Test-Path $shortcut) { Remove-Item $shortcut -Force }
          $p = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="' + $testDir + '"'),'/TASKS="desktopicon"') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El instalador devolvió código $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $testDir 'mcommerce-original.ico'))) { throw "No se instaló el icono de M Commerce" }
          $uninstall = Get-ChildItem $testDir -Filter 'unins*.exe' | Select-Object -First 1
          if (-not $uninstall) { throw "No se creó el desinstalador" }
          if (-not (Test-Path $shortcut)) { throw "No se creó el acceso directo del escritorio" }
          $u = Start-Process -FilePath $uninstall.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "El desinstalador devolvió código $($u.ExitCode)" }
          if (Test-Path $testDir) { Start-Sleep -Seconds 1; Remove-Item $testDir -Recurse -Force -ErrorAction SilentlyContinue }
          if (Test-Path $shortcut) { Remove-Item $shortcut -Force -ErrorAction SilentlyContinue }
          Write-Host "Smoke test OK: instalar, crear acceso directo y desinstalar."

      - name: Publish generated installer and exact brand assets
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/M-Commerce-Panel-Maestro-Setup.exe assets/m-commerce-brand-original-192.png assets/m-commerce-brand-original-512.png
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "build(master): publish real Windows installer"
          git push

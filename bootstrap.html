<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061327">
  <title>M Commerce · Cargando</title>
  <link rel="icon" href="/assets/m-commerce-mark.svg">
  <style>
    html,body{height:100%;margin:0;background:#061327;color:#fff;font-family:Inter,system-ui,sans-serif}.boot{height:100%;display:grid;place-items:center;text-align:center}.card{display:grid;justify-items:center;gap:14px}.logo{width:78px;height:78px;object-fit:contain}.brand{font-size:23px;font-weight:800}.status{font-size:13px;color:#a9b5c7}.retry{display:none;margin-top:8px;border:0;border-radius:12px;padding:12px 18px;background:#1768ff;color:#fff;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <div class="boot"><div class="card"><img class="logo" src="/assets/m-commerce-mark.svg" alt="M Commerce"><div class="brand">M Commerce</div><div class="status" id="status">Conectando con la plataforma…</div><button class="retry" id="retry" type="button">REINTENTAR</button></div></div>
  <script>
  (()=>{
    const OFFICIAL='https://m-commerce-ar.vercel.app';
    const RUNTIME='https://kjoixhzaxopdbmudzfsg.supabase.co/functions/v1/j3-runtime';
    const p=location.pathname.replace(/\/+$/,'')||'/';

    // La web pública oficial de M Commerce es Simple. El runtime histórico queda sólo para paneles internos.
    if(p==='/'||p==='/index.html'){
      location.replace(OFFICIAL+'/simple'+location.search+location.hash);
      return;
    }

    const routes={
      '/master':'master.html','/master.html':'master.html','/app-maestro/panel':'master.html',
      '/comercio':'comercio.html','/comercio.html':'comercio.html','/app-comercio/panel':'comercio.html',
      '/auth':'auth.html','/auth.html':'auth.html',
      '/app-maestro/install':'instalar-maestro.html','/app-comercio/install':'instalar-comercio.html',
      '/diseno':'diseno.html','/diseno.html':'diseno.html','/design':'diseno.html',
      '/vendedor':'vendedor.html','/vendedor.html':'vendedor.html','/seller':'vendedor.html','/app-vendedor/panel':'vendedor.html',
      '/reset':'reset-j3.html','/reset-j3':'reset-j3.html','/reset-j3.html':'reset-j3.html'
    };
    const file=routes[p]||'index.html';
    const status=document.getElementById('status');
    const retry=document.getElementById('retry');
    const portal=new URLSearchParams(location.search).get('portal');
    const runtimeApp=file==='diseno.html'&&['master','merchant','seller'].includes(portal)?portal:'';

    async function load(){
      retry.style.display='none';
      status.textContent='Conectando con la plataforma…';
      const c=new AbortController();
      const t=setTimeout(()=>c.abort(),15000);
      try{
        const appQ=runtimeApp?'&app='+encodeURIComponent(runtimeApp):'';
        const r=await fetch(RUNTIME+'?path='+encodeURIComponent(file)+appQ+'&host=m-commerce-ar&ts='+Date.now(),{cache:'no-store',signal:c.signal});
        if(!r.ok)throw new Error('HTTP_'+r.status);
        const html=await r.text();
        if(!/<html[\s>]/i.test(html))throw new Error('INVALID_RUNTIME');
        document.open();document.write(html);document.close();
      }catch(e){
        console.error('M Commerce runtime unavailable',e);
        status.textContent='No pudimos conectar con M Commerce. Revisá la conexión y volvé a intentar.';
        retry.style.display='inline-block';
      }finally{clearTimeout(t)}
    }
    retry.onclick=load;
    load();
  })();
  </script>
</body>
</html>
